<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يوميات نوبا وبسبس ٢</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--lh:34px;--paper:#f5ead6;--ink:#4a3535;--pink:#f6b8c8;--yellow:#ffd96b;--emerald:#2ee59d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;color:var(--ink);
  background:var(--paper) radial-gradient(rgba(120,90,60,.13) 1.2px,transparent 1.4px) 0 0/22px 22px}
.stage{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;padding:calc(16px + env(safe-area-inset-top)) clamp(10px,3vw,40px) calc(12px + env(safe-area-inset-bottom));max-width:1000px;margin:auto}

/* ===== البولارويد ===== */
.frame{position:relative;display:flex;background:#fffdf8;padding:10px 10px 38px;border-radius:3px;transform:rotate(-.5deg);
  box-shadow:0 10px 26px rgba(80,50,30,.28)}
.frame::before,.frame::after{content:"";position:absolute;top:-11px;width:86px;height:24px;z-index:20}
.frame::before{right:12%;transform:rotate(-5deg);background:repeating-linear-gradient(45deg,rgba(246,184,200,.85) 0 8px,rgba(255,255,255,.6) 8px 16px)}
.frame::after{left:12%;transform:rotate(4deg);background:repeating-linear-gradient(-45deg,rgba(255,217,107,.85) 0 8px,rgba(255,255,255,.6) 8px 16px)}
.cap{position:absolute;bottom:6px;right:18px;font-size:1.1rem;font-weight:700;transform:rotate(-1.5deg)}
.title{position:absolute;top:14px;left:14px;z-index:9;background:var(--yellow);color:var(--ink);padding:2px 14px;border-radius:6px;
  font-weight:700;font-size:.9rem;transform:rotate(-3deg);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.world{position:relative;flex:1;overflow:hidden}

/* ===== المشاهد ===== */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.scene.active{opacity:1;visibility:visible}
.s1{background:linear-gradient(#9fb4c4,#c4d1da 70%,#dfe6ea);--floor:#8bb08a}
.s2{background:linear-gradient(#a9bfcf,#cadae4 70%,#e4edf1);--floor:#7fae85}
.s3{background:linear-gradient(#0a0f20,#17243f 70%,#24385c);--floor:#1d3a30}
.s4{background:linear-gradient(#e9c79a,#d9a46a 75%,#c88a50);--floor:#9a6234}
.s5{background:linear-gradient(#2a2c5a,#6a4f95 65%,#c07aa0);--floor:#3a3568}
.floor{position:absolute;left:-5%;right:-5%;bottom:0;height:22%;background:var(--floor);border-radius:50% 50% 0 0/28px 28px 0 0;z-index:4}
.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s infinite}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.drop{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(transparent,rgba(80,110,150,.7));animation:rain linear infinite;z-index:6}
.s4 .drop{background:linear-gradient(transparent,rgba(210,230,255,.8))}

/* ===== الشخصيات ===== */
.char{position:absolute;z-index:3;cursor:pointer;bottom:14%;transition:transform 1.2s ease}
.nuba{width:clamp(110px,20vw,200px)}.besbes{width:clamp(130px,23vw,230px)}
.fig{filter:url(#rough)}
.char svg{display:block;width:100%;height:auto;overflow:visible}
.nuba .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3.4s ease-in-out infinite}
.nuba .ear.b{animation-delay:.6s}
.nuba .eye,.ceyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.ceyes{filter:drop-shadow(0 0 6px var(--emerald))}
.head{transform-box:fill-box;transform-origin:40% 100%;animation:tilt 3.4s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:sway 2.6s ease-in-out infinite}
.hop svg{animation:hop .8s ease-out}
.wet svg{filter:brightness(.8) saturate(.85);animation:shiver .14s 24}
.happy svg{animation:hop 2s ease-in-out infinite}
.walk svg{animation:bob .5s ease-in-out infinite}

/* فقاعات الكلام */
.say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);z-index:9;width:max-content;max-width:42vw;
  background:#fff;color:#3a2a2a;border:2.5px solid #3a2a2a;border-radius:18px 22px 20px 14px;padding:5px 13px;
  font-weight:700;font-size:clamp(.8rem,2.1vw,1.05rem);line-height:1.5;text-align:center;animation:sayin .35s cubic-bezier(.3,1.6,.5,1)}
.say::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:#fff;border:2.5px solid #3a2a2a;
  border-top:0;border-left:0;transform:translate(-50%,-7px) rotate(45deg)}
.sfx{position:absolute;left:50%;bottom:30%;z-index:9;font-size:clamp(2rem,8vw,4rem);font-weight:700;color:var(--yellow);
  -webkit-text-stroke:3px #3a2a2a;paint-order:stroke fill;animation:sfx 1.2s ease-out forwards;pointer-events:none}

/* ===== المشهد 1 ===== */
.umb{position:absolute;left:50%;bottom:8%;width:clamp(220px,40vw,400px);z-index:5;transform-origin:50% 100%;filter:url(#rough);
  transform:translateX(-50%) scale(.26) rotate(-75deg);transition:transform 1.1s cubic-bezier(.3,1.5,.5,1),bottom 1.1s}
.umb svg{display:block;width:100%}
.s1.open .umb{bottom:36%;transform:translateX(-50%) scale(1) rotate(0)}
.s1.open .nuba{transform:translateX(11vw)}.s1.open .besbes{transform:translateX(-11vw)}
.s1 .nuba{left:14%}.s1 .besbes{right:14%}
/* ===== المشهد 2 ===== */
.puddle{position:absolute;left:50%;bottom:9%;width:min(44vw,400px);height:50px;transform:translateX(-50%);z-index:5;border-radius:50%;
  background:radial-gradient(ellipse,#bfe3f5,#6aa4c4);box-shadow:inset 0 4px 10px rgba(255,255,255,.5)}
.s2 .nuba{left:10%}.s2 .besbes{right:10%}
.splash{position:absolute;width:9px;height:9px;border-radius:50%;background:#bfe3f5;border:1.5px solid #5b8fb0;z-index:6;animation:splash 1s ease-out forwards}
/* ===== المشهد 3 ===== */
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#e9ff9a;opacity:.35;z-index:5;animation:drift 6s ease-in-out infinite;transition:all 1s}
.s3.lit .fly{opacity:1;width:9px;height:9px;box-shadow:0 0 14px 6px rgba(233,255,154,.75)}
.trail{position:absolute;left:8%;right:8%;bottom:11%;height:16px;border-radius:50%;z-index:5;opacity:0;transition:opacity 2s;background:radial-gradient(ellipse,rgba(233,255,154,.55),transparent 70%)}
.s3.lit .trail{opacity:1}
.s3 .nuba{left:26%}.s3 .besbes{left:calc(26% + clamp(120px,22vw,210px))}
.s3.lit .nuba,.s3.lit .besbes{transform:translateX(-6vw)}
/* ===== المشهد 4 ===== */
.win{position:absolute;top:10%;right:9%;width:clamp(100px,20vw,180px);aspect-ratio:1;border:9px solid #6b4128;border-radius:14px 14px 0 0;
  background:linear-gradient(#34425e,#5a6f94);overflow:hidden;z-index:1}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(#6b4128,#6b4128) center/6px 100% no-repeat,linear-gradient(#6b4128,#6b4128) center/100% 6px no-repeat}
.lamp{position:absolute;top:-10%;left:-6%;width:60%;aspect-ratio:1;border-radius:50%;z-index:1;background:radial-gradient(circle,rgba(255,236,170,.7),transparent 65%);animation:flicker 3s ease-in-out infinite}
.table{position:absolute;left:50%;bottom:11%;width:min(42vw,340px);height:16px;border-radius:8px;background:#7a4a28;transform:translateX(-50%);z-index:5}
.cup{position:absolute;bottom:100%;width:34px;height:26px;background:#fff8ee;border:2px solid #7a4a28;border-radius:0 0 17px 17px;transition:transform .6s}
.cup.c1{left:30%}.cup.c2{right:30%}
.cup i{position:absolute;bottom:100%;left:50%;width:10px;height:22px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(3px);animation:steam 2.4s ease-out infinite}
.cup.c2 i{animation-delay:1s}
.s4.clink .c1{transform:translateX(18px)}.s4.clink .c2{transform:translateX(-18px)}
.s4 .nuba{left:18%}.s4 .besbes{right:18%}
/* ===== المشهد 5 ===== */
.s5 .nuba{left:calc(50% - clamp(120px,20vw,190px))}.s5 .besbes{right:calc(50% - clamp(130px,21vw,205px))}
.letter{position:absolute;top:6%;left:50%;width:min(88%,420px);z-index:8;color:#4a2c2c;font-family:'Aref Ruqaa',serif;font-weight:700;
  background:#fff6e2 repeating-linear-gradient(transparent 0 29px,rgba(200,120,120,.3) 29px 30px);border-radius:4px;padding:12px 20px;line-height:30px;
  font-size:clamp(.92rem,2.2vw,1.1rem);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateX(-50%) scale(.2) rotate(-8deg);opacity:0;
  max-height:90%;overflow-y:auto;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .6s;pointer-events:none}
.s5.open .letter{transform:translateX(-50%) scale(1) rotate(-1deg);opacity:1;pointer-events:auto}
.letter p{opacity:0}.s5.open .letter p{animation:fadein .8s forwards}
.heart{position:absolute;bottom:26%;color:#ff6f9c;font-size:1.7rem;z-index:7;pointer-events:none;animation:heart 4s ease-out forwards}

/* ===== ورقة الملاحظات ===== */
.note{background:#fffdf5 repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),rgba(100,140,200,.25) calc(var(--lh) - 1px) var(--lh));border-radius:4px;
  padding:12px clamp(14px,4vw,34px) 14px;box-shadow:0 4px 14px rgba(80,50,30,.2);transform:rotate(.4deg)}
.text{font-size:clamp(1rem,2.4vw,1.25rem);line-height:var(--lh);min-height:calc(var(--lh) * 2);font-weight:700;transition:opacity .4s}
.text.out{opacity:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;min-height:42px}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .15s}
.acts button{background:var(--yellow);border:2.5px dashed var(--ink);border-radius:12px 16px 12px 18px;padding:6px 18px;transform:rotate(-1.5deg);animation:wiggle 2s infinite}
.acts button:nth-child(2){transform:rotate(1.5deg);background:var(--pink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 20px}
@media (hover:hover){button:hover{transform:scale(1.06) rotate(0)}}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:3px solid var(--emerald);outline-offset:3px}
.dots{display:flex;gap:9px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);transition:.3s}
.dots i.on{background:#ff6f9c;border-color:#ff6f9c;transform:scale(1.3)}
.text,.nav{position:relative}

/* ===== المشهد 6: وقت النوم ===== */
.s6{background:linear-gradient(#241d4d,#3a2d6a 60%,#4e3a78);--floor:#2c2350}
.s6 .win{top:9%;right:7%;width:clamp(90px,17vw,150px)}
.s6 .lamp{left:6%}
.moon6{position:absolute;top:18%;left:22%;width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#f7e3a1);box-shadow:0 0 20px rgba(255,236,170,.6)}
.win i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 3s infinite}
.bed{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(94%,620px);aspect-ratio:600/340;z-index:5}
.bed>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:url(#rough)}
.breath{transform-box:fill-box;transform-origin:50% 0;animation:breathe 3.6s ease-in-out infinite}
.blanket{position:absolute;left:-2%;width:104%;bottom:5.3%;height:42.4%;z-index:6;cursor:grab;touch-action:none;
  transform:translateY(calc((1 - var(--t,0)) * 60%))}
.blanket.snap{transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.blanket svg{width:100%;height:100%;display:block;filter:drop-shadow(0 -4px 8px rgba(0,0,0,.3))}
.blanket::before{content:"";position:absolute;left:0;right:0;top:-44px;height:44px}
.s6.covered .blanket{pointer-events:none;cursor:default}
.s6.covered .blanket svg{animation:breathe 4s ease-in-out infinite}
.hint{position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;color:#fff;
  background:rgba(0,0,0,.4);padding:2px 14px;border-radius:999px;animation:bob 1s ease-in-out infinite;pointer-events:none}
.s6.covered .hint,.blanket.drag .hint{display:none}
.nb,.bb{position:absolute;top:12%;width:2px;height:2px;z-index:9}
.nb{left:36.7%}.bb{left:65%}
.zz{position:absolute;top:30%;z-index:9;font-weight:700;font-size:1.6rem;color:#cfd6ff;opacity:0;pointer-events:none}
.zz.a{left:46%}.zz.b{left:75%}
.s6.covered .zz{animation:zzz 3s ease-out infinite}.s6.covered .zz.b{animation-delay:1.3s}
.dim{position:absolute;inset:0;background:#040618;opacity:0;transition:opacity 2.5s;z-index:8;pointer-events:none}
.s6.covered .dim{opacity:.5}
.s6.covered .lamp{animation:none;opacity:0;transition:opacity 1.5s}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(24px,-50px) scale(1.2)}}

/* ===== شاشة القفل ===== */
.lock{overflow:auto;position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
  background:var(--paper) radial-gradient(rgba(120,90,60,.13) 1.2px,transparent 1.4px) 0 0/22px 22px;transition:opacity .9s,visibility .9s}
.lock.gone{opacity:0;visibility:hidden}
.env{font-size:clamp(4rem,16vw,6.5rem);animation:wiggle 2s infinite;filter:drop-shadow(3px 5px 0 rgba(80,50,30,.2))}
.lock h1{font-size:clamp(1.4rem,5vw,2rem)}
.lock p{max-width:340px;line-height:1.8}
.lock input{font:inherit;font-weight:700;text-align:center;direction:ltr;width:min(260px,80vw);padding:8px 14px;border:2.5px dashed var(--ink);
  border-radius:14px;background:#fffdf5;color:var(--ink);font-size:1.2rem}
.lock input:focus-visible{outline:3px solid var(--emerald);outline-offset:3px}
.lock button{background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:6px 28px;font-size:1.1rem}
.lock .err{color:#c2415f;min-height:1.6em;font-weight:700}
.shake{animation:shiver .1s 6}

/* ===== الحركات ===== */
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes rain{to{transform:translateY(110vh)}}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
@keyframes shiver{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-60px)}60%{transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-26px)}}
@keyframes splash{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes flicker{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-34px) scale(1.4)}}
@keyframes fadein{to{opacity:1}}
@keyframes heart{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-30vh) scale(1.2)}}
@keyframes sayin{from{opacity:0;transform:translateX(-50%) scale(.5)}}
@keyframes sfx{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,0) scale(1.2) rotate(6deg)}100%{opacity:0;transform:translate(-50%,-50px) scale(1) rotate(-4deg)}}
@keyframes wiggle{0%,100%{rotate:0deg}50%{rotate:2deg}}
/* ===== زر صوت المطر ===== */
.snd{position:absolute;top:46px;left:14px;z-index:20;width:40px;height:40px;padding:0;border-radius:50%;background:#fff;
  border:2px solid var(--ink);font-size:1.15rem;display:grid;place-items:center;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.snd.off{opacity:.55}
/* ===== الجوال ===== */
@media (max-width:600px){
  :root{--lh:30px}
  .stage{gap:10px;padding-inline:10px}
  .frame{padding:8px 8px 34px}
  .title{font-size:.8rem}
  .text{font-size:1rem;min-height:calc(var(--lh) * 3)}
  .say{font-size:.9rem;max-width:46vw}
  .s2 .nuba{left:4%}.s2 .besbes{right:4%}.puddle{width:36vw}
  .s4 .nuba{left:8%}.s4 .besbes{right:8%}
  .acts button,.nav button{min-height:44px;padding:8px 22px}
  .dots{gap:7px}
}
/* الجوال بالوضع الأفقي */
@media (orientation:landscape) and (max-height:520px){
  .stage{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);padding-top:10px}
  .note{align-self:center;max-height:100%;overflow:auto}
  .text{min-height:0}
  .nuba{width:clamp(80px,13vw,200px)}.besbes{width:clamp(95px,15vw,230px)}
  .say{max-width:26vw;font-size:.8rem}
  .title{display:none}.snd{top:14px}
  .env{font-size:3rem}.lock{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- فلتر يعطي الرسم شكل اليد (خطوط غير مستقيمة تمامًا) -->
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>

<div class="lock" id="lock">
  <div class="env">💌</div>
  <h1>هذي الحكاية لبسبس بس</h1>
  <p>اكتبي تاريخ أول يوم لنا مع بعض عشان تنفتح (يوم/شهر/سنة)</p>
  <input id="pass" inputmode="numeric" placeholder="--/--/----" autocomplete="off" aria-label="التاريخ">
  <div class="err" id="err" aria-live="polite"></div>
  <button id="go">افتحي</button>
</div>

<main class="stage">
  <div class="frame">
    <div class="title">يوميات نوبا وبسبس ٢</div>
    <div class="cap" id="cap"></div>
    <button class="snd" id="snd" aria-label="صوت المطر" aria-pressed="true">🔊</button>
    <div class="world">
      <section class="scene s1 active"><div class="rain"></div><div class="umb" data-umb></div>
        <div class="char nuba" data-nuba></div><div class="char besbes" data-cat></div><div class="floor"></div></section>
      <section class="scene s2"><div class="rain"></div><div class="puddle"></div>
        <div class="char nuba" data-nuba></div><div class="char besbes" data-cat></div><div class="floor"></div></section>
      <section class="scene s3"><div class="stars"></div><div class="trail"></div>
        <div class="char nuba walk" data-nuba></div><div class="char besbes walk" data-cat></div><div class="floor"></div></section>
      <section class="scene s4"><div class="lamp"></div><div class="win"><div class="rain"></div></div>
        <div class="char nuba" data-nuba></div><div class="char besbes" data-cat></div>
        <div class="table"><div class="cup c1"><i></i></div><div class="cup c2"><i></i></div></div><div class="floor"></div></section>
      <section class="scene s5"><div class="stars"></div><div class="letter" id="letter"></div>
        <div class="char nuba happy" data-nuba></div><div class="char besbes" data-cat></div><div class="floor"></div></section>
      <section class="scene s6">
        <div class="lamp"></div>
        <div class="win"><div class="moon6"></div><i style="top:12%;left:70%"></i><i style="top:60%;left:60%;animation-delay:1s"></i><i style="top:70%;left:20%;animation-delay:2s"></i></div>
        <div class="floor"></div>
        <div class="bed">
          <svg viewBox="0 0 600 340" aria-label="نوبا وبسبس على السرير">
            <rect x="40" y="6" width="520" height="170" rx="26" fill="#8a5a34" stroke="#5e3a1e" stroke-width="4"/>
            <rect x="64" y="26" width="472" height="120" rx="16" fill="#9d6a40" opacity=".7"/>
            <rect x="24" y="150" width="552" height="176" rx="28" fill="#f2e6d6" stroke="#cdb99d" stroke-width="3"/>
            <rect x="24" y="296" width="552" height="34" rx="10" fill="#8a5a34" stroke="#5e3a1e" stroke-width="3"/>
            <rect x="70" y="112" width="460" height="82" rx="40" fill="#f6b8c8" stroke="#d98fa5" stroke-width="3"/>
            <!-- نوبا -->

<script>
/* ===== 1) القصة بكلامك أنت =====
   cap = عنوان الصورة، text = السطر المكتوب، say = كلام الشخصيات ['n' نوبا / 'b' بسبس, الكلام]
   acts = أزرار التفاعل، done = السطر بعد الضغط */

const story = [

/* ===== 3) تركيب العناصر ===== */
const put = (sel, html) => document.querySelectorAll(sel).forEach(e => e.innerHTML = `<div class="fig">${html}</div>`);
put('[data-nuba]', NUBA); put('[data-cat]', CAT);
document.querySelectorAll('[data-umb]').forEach(e => e.innerHTML = UMB);

document.querySelectorAll('.rain').forEach(r => {
  const n = r.parentElement.classList.contains('win') ? 22 : 70;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('span'); d.className = 'drop';
    d.style.cssText = `left:${Math.random()*100}%;animation-duration:${.7+Math.random()*.6}s;animation-delay:${Math.random()*1.5}s`;
    r.appendChild(d);
  }
});
document.querySelectorAll('.stars').forEach(b => {
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('span');

    b.appendChild(s);
  }
});
for (let i = 0; i < 18; i++) {
  const f = document.createElement('span'); f.className = 'fly';
  f.style.cssText = `left:${6+Math.random()*88}%;bottom:${18+Math.random()*40}%;animation-delay:${Math.random()*6}s`;
  document.querySelector('.s3').appendChild(f);
}
document.getElementById('letter').innerHTML = letter.map((l, i) => `<p style="animation-delay:${.7+i*.7}s">${l}</p>`).join('');

/* ===== 4) مؤثرات وكلام الشخصيات ===== */
let timers = [];
function speak(scene, who, text) {
  const ch = scene.querySelector(who === 'n' ? '.nuba,.nb' : '.besbes,.bb');
  ch.querySelectorAll('.say').forEach(x => x.remove());
  const b = document.createElement('div'); b.className = 'say'; b.textContent = text; ch.appendChild(b);
  timers.push(setTimeout(() => b.remove(), 3000));
}
function talk(scene, lines, start = 900) {
  lines.forEach((l, i) => timers.push(setTimeout(() => speak(scene, l[0], l[1]), start + i * 2700)));
}
function hearts(scene, n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span'); h.className = 'heart'; h.textContent = '♥';
    h.style.cssText = `left:${35+Math.random()*30}%;--dx:${-40+Math.random()*80}px;animation-delay:${Math.random()*.8}s`;
    scene.appendChild(h); setTimeout(() => h.remove(), 5000);
  }
}
function splash(scene) {
  const w = document.createElement('span'); w.className = 'sfx'; w.textContent = 'طااخ!'; scene.appendChild(w);
  setTimeout(() => w.remove(), 1300);
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span'); s.className = 'splash';
    s.style.cssText = `left:${40+Math.random()*20}%;bottom:12%;--dx:${-90+Math.random()*180}px;--dy:${-60-Math.random()*90}px`;
    scene.appendChild(s); setTimeout(() => s.remove(), 1100);
  }
}

/* ===== 5) التنقل والتفاعل ===== */
const scenes = [...document.querySelectorAll('.scene')];
const textEl = document.getElementById('text'), actsEl = document.getElementById('acts'), dots = document.getElementById('dots');
const capEl = document.getElementById('cap'), prev = document.getElementById('prev'), next = document.getElementById('next');
const done = {}; let cur = 0;
scenes.forEach(() => dots.appendChild(document.createElement('i')));
function setText(t) { textEl.classList.add('out'); setTimeout(() => { textEl.textContent = t; textEl.classList.remove('out'); }, 300); }

function show(i) {
  cur = Math.max(0, Math.min(scenes.length - 1, i));
  timers.forEach(clearTimeout); timers = [];
  document.querySelectorAll('.say').forEach(x => x.remove());
  scenes.forEach((s, n) => s.classList.toggle('active', n === cur));
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === cur));
  prev.disabled = cur === 0; next.disabled = cur === scenes.length - 1;
  capEl.textContent = story[cur].cap; actsEl.innerHTML = ''; setRain(cur);
  if (done[cur]) { setText(done[cur]); return; }
  setText(story[cur].text);
  talk(scenes[cur], story[cur].say);
  story[cur].acts.forEach(a => {
    const b = document.createElement('button'); b.textContent = a.t;
    b.onclick = () => {
      timers.forEach(clearTimeout); timers = [];
      a.run(scenes[cur]); done[cur] = a.done; actsEl.innerHTML = ''; setText(a.done); talk(scenes[cur], a.say, 500);
    };
    actsEl.appendChild(b);
  });
}
next.onclick = () => show(cur + 1);
prev.onclick = () => show(cur - 1);
addEventListener('keydown', e => {                    // الاتجاه عكسي لأن الصفحة عربية
  if (e.key === 'ArrowLeft') show(cur + 1);
  if (e.key === 'ArrowRight') show(cur - 1);
});
document.addEventListener('click', e => {             // اضغطي على الشخصيات
  const ch = e.target.closest('.char'); if (!ch) return;
  if (ch.classList.contains('nuba')) { ch.classList.remove('hop'); void ch.offsetWidth; ch.classList.add('hop'); speak(ch.closest('.scene'), 'n', 'هيه! ♥'); }
  else speak(ch.closest('.scene'), 'b', 'مياو~');
});
/* ===== صوت المطر: يُولَّد بالكود (بدون ملفات) ويبدأ لما تفتحين القفل ===== */
let AC, rainGain, rainFilter, soundOn = true;
const levels = [.6, .6, .35, .25, .2, .14];           // قوة المطر في كل مشهد
const cutoff = [7000, 7000, 5000, 1500, 2200, 1200];  // داخل الكوخ يصير مكتوم أكثر
function startRain() {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx();
  const len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;      // ضجيج وردي (أنعم من الأبيض)
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = .99886*b0 + w*.0555179; b1 = .99332*b1 + w*.0750759; b2 = .969*b2 + w*.153852;
    b3 = .8665*b3 + w*.3104856; b4 = .55*b4 + w*.5329522; b5 = -.7616*b5 - w*.016898;
    d[i] = (b0+b1+b2+b3+b4+b5+b6 + w*.5362) * .11; b6 = w * .115926;
  }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
  rainFilter = AC.createBiquadFilter(); rainFilter.type = 'lowpass'; rainFilter.frequency.value = 6000;
  rainGain = AC.createGain(); rainGain.gain.value = 0;
  src.connect(hp); hp.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(AC.destination); src.start();
  const lfo = AC.createOscillator(), lg = AC.createGain();          // تموّج بسيط عشان يبان مطر طبيعي
  lfo.frequency.value = .18; lg.gain.value = .04; lfo.connect(lg); lg.connect(rainGain.gain); lfo.start();
  if (AC.state === 'suspended') AC.resume();
  setRain(cur);
}
function setRain(i) {
  if (!AC) return;
  rainGain.gain.setTargetAtTime(soundOn ? levels[i] : 0, AC.currentTime, .7);
  rainFilter.frequency.setTargetAtTime(cutoff[i], AC.currentTime, .8);
}
document.getElementById('snd').onclick = () => {
  soundOn = !soundOn;
  const b = document.getElementById('snd');
  b.textContent = soundOn ? '🔊' : '🔇'; b.classList.toggle('off', !soundOn); b.setAttribute('aria-pressed', soundOn);
  if (!AC) startRain(); else { if (AC.state === 'suspended') AC.resume(); setRain(cur); }
};
document.addEventListener('visibilitychange', () => {              // يوقف الصوت لما تطلعين من الصفحة
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (soundOn) AC.resume();
});

/* ===== المشهد الأخير: اسحبي البطانية لفوق (أو اضغطي عليها) ===== */
const bl = document.getElementById('blanket');
let covered = false, prog = 0, drag = null;
function coverBed(s) {                       // الجزء المرئي: البطانية، الإضاءة، النوم
  if (covered) return;
  covered = true; bl.classList.add('snap'); bl.style.setProperty('--t', 1);
  s.classList.add('covered'); hearts(s, 8); levels[5] = .06; setRain(5);
}
function finishBed() {                       // لما تُسحب البطانية باليد بدل الزر
  if (covered) return;
  const a = story[5].acts[0];
  timers.forEach(clearTimeout); timers = [];
  coverBed(scenes[5]); done[5] = a.done; actsEl.innerHTML = ''; setText(a.done); talk(scenes[5], a.say, 500);
}
bl.addEventListener('pointerdown', e => {
  if (covered) return;
  drag = { y: e.clientY, p0: prog }; bl.setPointerCapture(e.pointerId); bl.classList.remove('snap'); bl.classList.add('drag');
});
bl.addEventListener('pointermove', e => {
  if (!drag) return;
  prog = Math.max(0, Math.min(1, drag.p0 + (drag.y - e.clientY) / (bl.offsetHeight * .6)));
  bl.style.setProperty('--t', prog);
  if (prog >= .88) { drag = null; finishBed(); }
});
bl.addEventListener('pointerup', e => {
  if (!drag) return;
  const tap = Math.abs(drag.y - e.clientY) < 6; drag = null; bl.classList.remove('drag');
  if (tap) finishBed();
});

/* ===== القفل: يقبل 1/8/2025 أو 01-08-2025 أو 2025/8/1 أو بالأرقام العربية ===== */
const lock = document.getElementById('lock'), pass = document.getElementById('pass'), err = document.getElementById('err');
function tryOpen() {
  const v = pass.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const n = (v.match(/\d+/g) || []).map(Number).join('-');
  if (n === START.slice().reverse().join('-') || n === START.join('-')) {
    lock.classList.add('gone'); startRain(); show(0);
  } else {
    err.textContent = 'مو هذا… ';
    pass.classList.remove('shake'); void pass.offsetWidth; pass.classList.add('shake');
  }
}
document.getElementById('go').onclick = tryOpen;
pass.addEventListener('keydown', e => { if (e.key === 'Enter') tryOpen(); });
pass.focus();
